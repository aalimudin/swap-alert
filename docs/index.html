<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swap Alert Code Walkthrough</title>
<meta name="description" content="Learn C++, Qt, and Linux/macOS systems programming by reading a real tray app.">
<link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f8fa; --fg: #1f2328; --fg-muted: #59636e;
    --border: #d1d9e0; --accent: #0969da; --accent-soft: #ddf4ff;
    --try: #1a7f37; --try-bg: #dafbe1; --check: #8250df; --check-bg: #fbefff;
    --warn: #9a6700; --warn-bg: #fff8c5;
    --sidebar: 280px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-soft: #161b22; --fg: #e6edf3; --fg-muted: #9198a1;
      --border: #30363d; --accent: #4493f8; --accent-soft: #121d2f;
      --try: #3fb950; --try-bg: #0f2a19; --check: #ab7df8; --check-bg: #221a33;
      --warn: #d29922; --warn-bg: #2b2111;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Layout */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
    overflow-y: auto; padding: 24px 16px; border-right: 1px solid var(--border); background: var(--bg-soft);
  }
  .sidebar .brand { font-weight: 700; font-size: 1.05rem; margin: 0 8px 16px; color: var(--fg); display: block; }
  .sidebar ol { list-style: none; margin: 0; padding: 0; }
  .sidebar li a {
    display: block; padding: 5px 8px; border-radius: 6px; color: var(--fg-muted); font-size: .9rem; line-height: 1.35;
  }
  .sidebar li a:hover { background: var(--accent-soft); color: var(--fg); text-decoration: none; }
  .sidebar li a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { margin-left: var(--sidebar); padding: 40px 48px 96px; }
  .content { max-width: 860px; margin: 0 auto; }
  .menu-toggle { display: none; }

  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); transition: transform .2s; z-index: 20; width: min(85vw, 320px); }
    body.nav-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
    main { margin-left: 0; padding: 64px 16px 64px; }
    html { scroll-padding-top: 60px; }
    .menu-toggle {
      display: block; position: fixed; top: 0; left: 0; right: 0; z-index: 30; text-align: left;
      padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border);
      background: var(--bg-soft); color: var(--fg); font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    body.nav-open .sidebar { padding-top: 64px; }
  }

  /* Typography */
  h1 { font-size: 2.1rem; line-height: 1.25; margin: 0 0 16px; }
  h2 { font-size: 1.6rem; margin: 56px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.2rem; margin: 32px 0 12px; }
  h2, h3 { line-height: 1.3; }
  h2 .anchor, h3 .anchor { opacity: 0; margin-left: 8px; font-weight: 400; }
  h2:hover .anchor, h3:hover .anchor { opacity: .6; }
  hr { display: none; }
  code {
    font: .875em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 5px; padding: .1em .35em;
    overflow-wrap: anywhere;
  }
  pre {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; line-height: 1.5;
  }
  pre code { background: none; border: 0; padding: 0; font-size: .85rem; }
  pre code.hljs { background: none; padding: 0; }

  .table-wrap { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: .93rem; }
  th, td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; vertical-align: top; }
  th { background: var(--bg-soft); }

  /* Callouts */
  blockquote {
    margin: 20px 0; padding: 12px 18px; border-left: 4px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  blockquote > :first-child { margin-top: 0; }
  blockquote > :last-child { margin-bottom: 0; }
  blockquote.try { border-color: var(--try); background: var(--try-bg); }
  blockquote.check { border-color: var(--check); background: var(--check-bg); }
  blockquote.warn { border-color: var(--warn); background: var(--warn-bg); }
  blockquote pre { background: var(--bg); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; color: var(--check); }

  .status { color: var(--fg-muted); padding: 48px 0; }
  .footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--fg-muted); font-size: .9rem; }
</style>
</head>
<body>
<button class="menu-toggle" aria-expanded="false" aria-controls="sidebar">☰ Lessons</button>
<nav class="sidebar" id="sidebar" aria-label="Lessons">
  <a class="brand" href="#">Swap Alert Walkthrough</a>
  <ol id="toc"></ol>
</nav>
<main>
  <article class="content" id="content"><p class="status">Loading the walkthrough…</p></article>
  <div class="content footer">
    Rendered from <a id="source-link" href="https://github.com/aalimudin/swap-alert/blob/main/docs/CODE_WALKTHROUGH.md">docs/CODE_WALKTHROUGH.md</a>.
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/cmake.min.js"></script>
<script>
// The page renders the Markdown at load time so CODE_WALKTHROUGH.md stays the single source of truth.
const SOURCE = "CODE_WALKTHROUGH.md";
const REPO_DOCS = "https://github.com/aalimudin/swap-alert/blob/main/docs/";

const content = document.getElementById("content");
const toc = document.getElementById("toc");

// Same slug rules GitHub uses, so existing "#lesson-8--meet-qt" links keep working.
function slugify(text, used) {
  let slug = text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/ /g, "-");
  const base = slug;
  for (let n = 1; used.has(slug); n++) slug = `${base}-${n}`;
  used.add(slug);
  return slug;
}

function enhance() {
  // Heading ids + sidebar
  const used = new Set();
  content.querySelectorAll("h1, h2, h3").forEach((h) => {
    h.id = slugify(h.textContent, used);
    if (h.tagName === "H1") return;
    const title = h.textContent;
    const a = document.createElement("a");
    a.className = "anchor"; a.href = `#${h.id}`; a.textContent = "#"; a.setAttribute("aria-hidden", "true");
    h.append(a);
    if (h.tagName === "H2") {
      const li = document.createElement("li");
      li.innerHTML = `<a href="#${h.id}"></a>`;
      li.firstChild.textContent = title;
      toc.append(li);
    }
  });

  // Callout colours based on the bold lead-in text
  content.querySelectorAll("blockquote").forEach((q) => {
    const lead = (q.querySelector("strong")?.textContent || "").toLowerCase();
    if (lead.startsWith("try it")) q.classList.add("try");
    else if (lead.startsWith("check yourself")) q.classList.add("check");
    else if (lead.startsWith("common bug")) q.classList.add("warn");
  });

  // Wide tables scroll instead of overflowing the page on phones
  content.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap); wrap.append(t);
  });

  // Relative links (e.g. RELEASING.md) point to GitHub, where they render properly
  content.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (!/^(#|[a-z]+:)/i.test(href)) a.href = new URL(href, REPO_DOCS).href;
  });

  // Syntax highlighting ("text" blocks are diagrams; leave them alone)
  content.querySelectorAll("pre code").forEach((block) => {
    if (!block.className.includes("language-text")) hljs.highlightElement(block);
  });

  // Highlight the lesson currently on screen
  const links = new Map([...toc.querySelectorAll("a")].map((a) => [a.hash.slice(1), a]));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.classList.remove("active"));
      const a = links.get(e.target.id);
      if (a) { a.classList.add("active"); a.scrollIntoView({ block: "nearest" }); }
    });
  }, { rootMargin: "0px 0px -75% 0px" });
  content.querySelectorAll("h2").forEach((h) => observer.observe(h));

  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

fetch(SOURCE)
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
  .then((md) => {
    content.innerHTML = marked.parse(md);
    const title = content.querySelector("h1");
    if (title) document.title = title.textContent;
    enhance();
  })
  .catch((err) => {
    content.innerHTML = `<p class="status">Couldn't load <code>${SOURCE}</code> (${err.message}).<br>
      If you opened this file directly from disk, serve the folder instead:
      <code>python3 -m http.server -d docs</code> and open <a href="http://localhost:8000">http://localhost:8000</a>.</p>`;
  });

// Mobile menu
const toggle = document.querySelector(".menu-toggle");
toggle.addEventListener("click", () => {
  const open = document.body.classList.toggle("nav-open");
  toggle.setAttribute("aria-expanded", open);
});
toc.addEventListener("click", (e) => {
  if (e.target.closest("a")) { document.body.classList.remove("nav-open"); toggle.setAttribute("aria-expanded", false); }
});
</script>
</body>
</html>
